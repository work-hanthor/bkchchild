<title>아동부 예배 PPT 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽은 예배 순서대로 입력, 오른쪽은 슬라이드 큐시트(장수)와 만들기 버튼 */
:root{
  --bg:#f7f8f6; --surface:#ffffff; --sunk:#eef2f3; --ink:#1d2830; --muted:#5f6d76; --line:#dde3e6;
  --sky:#1f97c6; --sky-soft:#dff2fa; --sun:#f08c12; --sun-soft:#fff0dc; --coral:#e8524f; --coral-soft:#fde6e5;
  --ok:#2c8a55; --coral-strong:#c93a37; --sky-ink:#10688b;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171b; --surface:#182127; --sunk:#0d1316; --ink:#e7eef2; --muted:#9aa9b2; --line:#2a363e;
  --sky:#4cb8e2; --sky-soft:#173543; --sun:#ffab45; --sun-soft:#3d2c14; --coral:#ff7b77; --coral-soft:#3e2020; --ok:#5ccf8c; --coral-strong:#d6413e; --sky-ink:#bfe7f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171b; --surface:#182127; --sunk:#0d1316; --ink:#e7eef2; --muted:#9aa9b2; --line:#2a363e;
  --sky:#4cb8e2; --sky-soft:#173543; --sun:#ffab45; --sun-soft:#3d2c14; --coral:#ff7b77; --coral-soft:#3e2020; --ok:#5ccf8c; --coral-strong:#d6413e; --sky-ink:#bfe7f7; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:8px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;text-wrap:balance}
h1 .dot{color:var(--sun)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.date-field{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
section.part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.part-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--display);font-size:19px;line-height:1;padding:8px 16px 7px;border-radius:999px;color:#fff;background:var(--coral);white-space:nowrap}
.pill.sky{background:var(--sky)} .pill.sun{background:var(--sun)}
:root[data-theme="dark"] .pill, :root:not([data-theme="light"]) .pill{color:#fff}
.part-head .hint{color:var(--muted);font-size:13px}
.part-head .spacer{flex:1}
.part.compact{padding:14px 18px;gap:10px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-width:0}
.line .pill{min-width:104px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#date{max-width:200px}
.date-l{flex:0 0 auto}
.pill-space{width:104px;flex:0 0 auto}
@media (max-width:560px){.pill-space{display:none}}
.inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500;flex:1 1 220px;min-width:0}
.inline span{white-space:nowrap}
.inline input{flex:1;min-width:0}
.now{font-size:14px;color:var(--muted);flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.now b{color:var(--ink);font-weight:600}
.now b.empty{color:var(--muted);font-weight:400}
.toggle{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:6px 12px;min-height:36px;color:var(--muted);font-size:13.5px;margin-left:auto}
.toggle:hover{color:var(--ink)}
.toggle svg{transition:transform .15s}
.toggle[aria-expanded="true"]{color:var(--ink);background:var(--sunk)}
.toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.more{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px dashed var(--line);padding-top:12px}
.more[hidden]{display:none}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6}
textarea.lyrics{min-height:180px;font-size:14.5px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font-size:14px}
button:hover{border-color:var(--muted)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button.add{border-style:dashed;color:var(--muted);width:100%;padding:11px}
button.primary{background:var(--coral);border-color:var(--coral);color:#fff;font-family:var(--display);font-size:21px;padding:13px 18px;width:100%;border-radius:999px}
button.primary:disabled{opacity:.55;cursor:wait}
.check{display:flex;align-items:center;gap:8px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--sky)}
details.help{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:9px;padding:9px 12px}
details.help summary{cursor:pointer;font-weight:500;color:var(--ink)}
details.help ul{margin:8px 0 2px;padding-left:18px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 4px}

/* 찬양 카드 */
.songs{display:flex;flex-direction:column;gap:14px}
.song{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-left:5px solid var(--sky)}
.song.orange{border-left-color:var(--sun)}
.song-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.song-no{font-family:var(--display);font-size:18px;color:var(--muted);min-width:22px}
.song-head input{flex:1 1 180px;font-weight:600}
.color-tag{font-size:12.5px;font-weight:600;color:var(--sky);background:var(--sky-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.song.orange .color-tag{color:var(--sun);background:var(--sun-soft)}
:root:not([data-theme="dark"]) .song.orange .color-tag{color:#a85a00}
.swatches{display:flex;gap:4px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.blue{background:var(--sky)} .sw.orange{background:var(--sun)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;width:92px;height:52px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:10.5px;line-height:1.25;padding:5px 6px;color:var(--sky);overflow:hidden;position:relative;text-align:center;display:flex;align-items:center;justify-content:center}
.song.orange .chip,.chip.orange{color:var(--sun)}
.chip.title{background:var(--sky);color:#fff;font-family:var(--display);font-size:12px;border-color:transparent}
.song.orange .chip.title{background:var(--sun);color:#fff}
.chip.inter{color:var(--muted)}
.chip .tag{position:absolute;top:2px;left:2px;background:var(--ink);color:var(--bg);font-size:8.5px;padding:0 3px;border-radius:3px}
.song-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.song-foot .spacer{flex:1}

/* 그림 */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:16/9;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.55));padding:14px 4px 3px}
.thumb .ctl button{background:transparent;border:0;color:#fff;padding:2px 6px;font-size:13px}
.thumb .n{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:4px;padding:0 5px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop.over{border-color:var(--sky);background:var(--sky-soft)}
.drop input{display:none}

.deck{display:flex;flex-direction:column;gap:8px}
.deck-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.deck-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.deck-head .spacer{flex:1}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sl{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:8px 10px;border-radius:9px;background:var(--sun-soft);border:1.5px solid var(--sun);min-width:0}
.sl[aria-pressed="false"]{background:var(--surface);border-color:var(--line);opacity:.55}
.sl .no{font-family:var(--display);font-size:16px}
.sl .tx{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.sl .bd{display:flex;gap:4px;flex-wrap:wrap}
.sl .bd span{font-size:10.5px;border-radius:4px;padding:0 5px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sl .bd .anim{color:var(--sky);border-color:var(--sky)}
.sub{display:flex;flex-direction:column;gap:8px;min-width:0}
.sub + .sub{border-top:1px solid var(--line);padding-top:16px}
.sub-h{margin:0;font-size:16px;font-weight:600;line-height:1.4;color:var(--ink)}
.sub-h label{color:inherit}
.sub .small{margin:0}
.thumbs:empty{display:none}
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:8px;align-items:start}
@media (max-width:560px){.quiz{grid-template-columns:minmax(0,1fr) auto}.quiz .ans{grid-column:1}}

/* 큐시트 */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:900px){aside{position:static}}
.cue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cue h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px}
.cue .total{font-size:13px;color:var(--muted);margin-bottom:10px}
.cue ol{list-style:none;margin:0;padding:0;max-height:46vh;overflow:auto;border-top:1px solid var(--line)}
.cue li{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.cue li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cue li .cnt{font-variant-numeric:tabular-nums;color:var(--muted);flex:0 0 auto}
.status{font-size:13.5px;min-height:20px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--coral)}
.small{font-size:12.5px;color:var(--muted)}
.lib-btn{width:100%;display:flex;justify-content:space-between;align-items:center}

/* 찬양 목록 서랍 */
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,25,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.drawer h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.drawer .tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lib{flex:1;overflow:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lib-item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.lib-item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lib-item .t{display:flex;align-items:baseline;gap:8px;min-width:0}
.lib-item .tt{font-weight:600;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .cnt{flex:0 0 auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.lib-item .ly{font-size:12.5px;color:var(--muted);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-hint{margin:0 0 8px;line-height:1.5}
.lib-hint b{color:var(--ink)}
.note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px;min-width:0}
.note span{white-space:nowrap;font-weight:500}
.note input{flex:1;min-width:0;font-size:12.5px;padding:5px 8px;border-radius:7px}
.cmp-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp-notes[hidden]{display:none}
.cmp-notes .note{margin:0;font-size:13px}
.cmp-notes .note input{font-size:13.5px;padding:8px 10px}
@media (max-width:640px){.cmp-notes{grid-template-columns:minmax(0,1fr)}}
.lib-item .a{flex:0 0 auto;display:grid;grid-template-columns:max-content;gap:6px}
.lib-item .a button{min-height:34px;padding:0 12px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.lib-item .a .use{background:var(--sky-soft);border-color:var(--sky);color:var(--sky-ink);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--coral)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}

/* 가사 비교 팝업 */
.cmp-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:30}
.cmp{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100% - 24px));height:min(660px,calc(100% - 24px));box-sizing:border-box;background:var(--surface);border-radius:18px;padding:24px 26px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(10,20,25,.3)}
.cmp-head{display:flex;gap:12px;align-items:flex-start}
.cmp-headtext{flex:1;min-width:0}
.cmp-step{font-size:13px;font-weight:500;color:var(--muted)}
.cmp h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:2px 0 4px;overflow-wrap:anywhere}
.cmp p{margin:0;font-size:14px;color:var(--muted)}
.cmp-x{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.cmp-x:hover{background:var(--sunk);color:var(--ink)}
.cmp-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:1;min-height:0}
.cmp-col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.cmp-colhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px}
.cmp-colhead span{font-size:12.5px;color:var(--muted)}
.cmp-list{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.cmp-row{display:flex;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid transparent}
.cmp-row.diff{background:var(--sun-soft);border-color:var(--sun)}
.cmp-row.gone{background:var(--sun-soft);border:1px dashed var(--sun)}
.cmp-row.gone .cmp-body{font-style:italic;color:var(--muted)}
.cmp-no{font-family:var(--display);font-size:15px;color:var(--muted);width:18px;flex:0 0 auto}
.cmp-body{font-size:13.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.cmp-body mark{background:#ffd99a;color:#5a2e00;border-radius:3px;padding:0 2px}
.cmp-tag{display:inline-block;font-size:10.5px;background:var(--ink);color:var(--bg);border-radius:3px;padding:0 4px;margin-bottom:2px}
.cmp-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cmp-choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;min-height:72px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left}
.cmp-choice[aria-checked="true"]{border-color:var(--sky);background:var(--sky-soft)}
.cmp-ct{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.cmp-cd{font-size:12.5px;color:var(--muted);line-height:1.45}
.cmp-dot{width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:2px solid var(--muted);flex:0 0 auto}
.cmp-choice[aria-checked="true"] .cmp-dot{border:5px solid var(--sky);background:var(--surface)}
.cmp-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cmp-all[hidden]{display:none}
.cmp-all{display:flex;align-items:center;gap:8px;font-size:13.5px}
.cmp-all input{width:18px;height:18px;accent-color:var(--sky)}
.cmp-spacer{flex:1}
.cmp-stop{height:44px;padding:0 18px;border-radius:999px}
.cmp-ok{height:44px;padding:0 26px;border-radius:999px;border:0;background:var(--coral-strong);color:#fff;font-family:var(--display);font-size:18px}
@media (max-width:640px){.cmp{padding:18px 16px 16px}.cmp-cols{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}.cmp-choices{grid-template-columns:minmax(0,1fr)}.cmp-choice{min-height:0}.cmp-cd{display:none}}
</style>
